<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beesbury - AI Assistant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e4e4e7;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background: #111113;
            border-radius: 16px;
            border: 1px solid #27272a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .chat-header {
            background: #18181b;
            padding: 20px 24px;
            border-bottom: 1px solid #27272a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bee-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #111113;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .chat-title {
            color: #f4f4f5;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .status-indicator {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #71717a;
            font-size: 13px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 2px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 100%;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            margin-top: 2px;
        }

        .message.user .message-avatar {
            background: #3f3f46;
            color: #f4f4f5;
        }

        .message.ai .message-avatar {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #111113;
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-text {
            background: transparent;
            color: #e4e4e7;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-text {
            color: #f4f4f5;
        }

        .message.ai .message-text {
            color: #e4e4e7;
        }

        .typewriter-cursor {
            display: inline-block;
            background: #fbbf24;
            width: 2px;
            height: 1.2em;
            margin-left: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .chat-input {
            padding: 20px 24px;
            background: #18181b;
            border-top: 1px solid #27272a;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #prompt {
            width: 100%;
            background: #111113;
            border: 1px solid #3f3f46;
            border-radius: 12px;
            padding: 12px 16px;
            color: #f4f4f5;
            font-size: 15px;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        #prompt::placeholder {
            color: #71717a;
        }

        #prompt:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
        }

        .send-button {
            background: #fbbf24;
            border: none;
            border-radius: 10px;
            width: 44px;
            height: 44px;
            color: #111113;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .send-button:hover:not(:disabled) {
            background: #f59e0b;
            transform: translateY(-1px);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .typing-indicator {
            display: none;
            gap: 12px;
            align-items: flex-start;
        }

        .typing-indicator .message-avatar {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #111113;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            margin-top: 2px;
        }

        .typing-content {
            color: #71717a;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }

        .typing-dots {
            display: inline-flex;
            gap: 3px;
        }

        .typing-dots span {
            width: 4px;
            height: 4px;
            background: #71717a;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            30% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .welcome-message {
            text-align: center;
            color: #71717a;
            margin: auto;
            padding: 60px 40px;
            max-width: 500px;
        }

        .welcome-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #111113;
            font-weight: 700;
            letter-spacing: -1px;
            margin: 0 auto 20px;
        }

        .welcome-message h3 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #f4f4f5;
            font-weight: 600;
        }

        .welcome-message p {
            font-size: 15px;
            line-height: 1.6;
            color: #a1a1aa;
        }

        @media (max-width: 768px) {
            .chat-container {
                height: 90vh;
                border-radius: 12px;
                margin: 10px;
            }

            .chat-messages {
                padding: 20px 16px;
                gap: 20px;
            }

            .chat-input {
                padding: 16px;
            }

            .welcome-message {
                padding: 40px 20px;
            }

            .chat-title {
                font-size: 16px;
            }
        }

        /* Scrollbar styling for the input box */
#prompt::-webkit-scrollbar {
    width: 6px; /* slim like the chat scrollbar */
}

#prompt::-webkit-scrollbar-track {
    background: transparent; /* keep it clean */
}

#prompt::-webkit-scrollbar-thumb {
    background: #3f3f46; /* same muted gray as chat scroll */
    border-radius: 3px;
}

#prompt::-webkit-scrollbar-thumb:hover {
    background: #52525b; /* slightly lighter on hover */
}

/* Firefox support */
#prompt {
    scrollbar-width: thin;
    scrollbar-color: #3f3f46 transparent;
}

    </style>
     <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>

</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="logo-container">
                <div class="bee-logo">B</div>
                <div class="chat-title">Beesbury</div>
            </div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>Online</span>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <div class="welcome-logo">B</div>
                <h3>Welcome to Beesbury</h3>
                <p>Your intelligent AI assistant is ready to help. Ask me anything and let's start our conversation!</p>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <div class="message-avatar">B</div>
            <div class="typing-content">
                Thinking
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <div class="chat-input">
            <div class="input-wrapper">
                <textarea id="prompt" placeholder="Message Beesbury..." rows="1"></textarea>
            </div>
            <button class="send-button" onclick="sendMessage()" id="sendButton">
                <i class="fas fa-arrow-up"></i>
            </button>
        </div>
    </div>
  
    <script>
        const chatMessages = document.getElementById('chatMessages');
        const promptInput = document.getElementById('prompt');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');
       const msgArr = [
  {
    role: "system",
    content: `
You are Beesbury, an AI assistant.  
Make sure your responses are random and not the same as your previouses.
Put on that hustler tone.
Always respond in valid **Markdown**, using code blocks, headings, lists, etc.  

### Formatting Rules:
- Write in clear, well-structured **paragraphs**.  
- Keep each paragraph between **2–5 sentences**.  
- Use **headings** to separate sections when appropriate.  
- Use **lists or bullet points** for multiple items.  
- Never output raw JSON or unformatted text — only Markdown.  
- Keep responses **concise but detailed** enough to be useful.  

Your name is **Beesbury**. Display it naturally when greeting or signing off.
Copyright Gem Akinbo
    `
  }
];


        // Auto-resize textarea
        promptInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // Send message on Enter (but allow Shift+Enter for new lines)
        promptInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function typeWriter(element, text, speed = 30) {
            return new Promise((resolve) => {
                let i = 0;
                const cursor = document.createElement('span');
                cursor.className = 'typewriter-cursor';
                element.appendChild(cursor);

                function type() {
                    if (i < text.length) {
                        const char = text.charAt(i);
                        const textNode = document.createTextNode(char);
                        element.insertBefore(textNode, cursor);
                        i++;
                        setTimeout(type, speed);
                    } else {
                        cursor.remove();
                        resolve();
                    }
                }
                type();
            });
        }

        function addMessage(content, isUser = false, useTypewriter = false) {
            // Remove welcome message if it exists
            const welcomeMessage = document.querySelector('.welcome-message');
            if (welcomeMessage) {
                welcomeMessage.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = isUser ? 'U' : 'B';
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            
            const messageText = document.createElement('div');
            messageText.className = 'message-text';
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(messageContent);
            messageContent.appendChild(messageText);
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            if (!isUser) {
    // Render AI response as Markdown → sanitized HTML
    const rawHtml = marked.parse(content);
    const safeHtml = DOMPurify.sanitize(rawHtml);
    messageText.innerHTML = safeHtml;
    return Promise.resolve();
} else {
    // Keep user messages as plain text
    messageText.textContent = content;
    return Promise.resolve();
}

        }

        function showTypingIndicator() {
            typingIndicator.style.display = 'flex';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTypingIndicator() {
            typingIndicator.style.display = 'none';
        }

        function setLoading(loading) {
            sendButton.disabled = loading;
            if (loading) {
                sendButton.innerHTML = '<i class="fas fa-spinner"></i>';
            } else {
                sendButton.innerHTML = '<i class="fas fa-arrow-up"></i>';
            }
        }

        async function sendMessage() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            // Add user message
            await addMessage(prompt, true, false);
            
            // Clear input and reset height
            promptInput.value = '';
            promptInput.style.height = 'auto';
            
            // Show loading states
            setLoading(true);
            showTypingIndicator();

            try {

                msgArr.push({role: "user", content: prompt});
                const result = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer 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",
                        "Content-Type": "application/json",
                        "HTTP-Referer": "https://yourdomain.com",
                        "X-Title": "Beesbury AI Assistant"
                    },
                    body: JSON.stringify({
                        model: "nousresearch/hermes-2-pro-llama-3-8b",
                        messages: msgArr,
                    })
                });

                const data = await result.json();
                
                // Hide loading states
                hideTypingIndicator();
                setLoading(false);

                if (data.choices && data.choices[0]) {
                    await addMessage(data.choices[0].message.content, false, true);
                    msgArr.push({role: "assistant", content: data.choices[0].message.content})
                } else {
                    console.error("Unexpected response:", data);
                    await addMessage("I apologize, but I'm having trouble processing your request. Please try again.", false, true);
                }
            } catch (error) {
                console.error("Error:", error);
                hideTypingIndicator();
                setLoading(false);
                await addMessage("I'm experiencing some technical difficulties. Please check your connection and try again.", false, true);
            }

            // Focus back to input
            promptInput.focus();
        }

        // Focus input on load
        window.addEventListener('load', () => {
            promptInput.focus();
        });
    </script>
</body>
</html>
